  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-spinner');
      if (loader) { loader.style.opacity = '0'; setTimeout(function() { loader.remove(); }, 300); }
    });
    // Fallback: remove loader after 12s if already initialized
    setTimeout(function() {
      var loader = document.getElementById('loading-spinner');
      if (loader) { loader.style.opacity = '0'; setTimeout(function() { loader.remove(); }, 300); }
    }, 12000);
  </script>

  <script>
    // 0. Auto-Unregister Stale Service Workers & Purge Old Cache on Startup
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var n of names) { caches.delete(n); }
        });
      }
    } catch(e) {}

    // 1. Disable Right Click Context Menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });

    // 2. Intercept DevTools and Shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || 
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) ||
          (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P'))) {
        e.preventDefault();
        return false;
      }
    });

    // 3. PrintScreen Key Detection & Clipboard Clearing
    window.addEventListener('keyup', function(e) {
      if (e.key === 'PrintScreen') {
        if (navigator.clipboard) {
          navigator.clipboard.writeText('');
        }
      }
    });

    // 4. Native Korean Web Speech Synthesis Engine (ko-KR)
    window.speakKoreanWeb = function(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var cleanText = text.replace(/\[.*?\]/g, '').trim();
          var utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'ko-KR';
          utterance.rate = 0.88;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      } catch (err) {
        console.warn('Native Korean TTS error:', err);
      }
    };
  </script>

    // Direct Firebase Storage Web Upload Engine
    window.firebaseUploadToStorage = async function(dataUrl, storagePath) {
      try {
        if (typeof firebase === 'undefined' || !firebase.storage) {
          return null;
        }
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const storageRef = firebase.storage().ref(storagePath);
        const snapshot = await storageRef.putString(dataUrl, 'data_url');
        const downloadUrl = await snapshot.ref.getDownloadURL();
        return downloadUrl;
      } catch (err) {
        console.warn('Firebase Storage upload error:', err);
        return null;
      }
    };

    // Official Real Google Sign-In Popup Engine
    window.firebaseSignInWithGoogle = async function() {
      try {
        if (typeof firebase === 'undefined') {
          return JSON.stringify({ success: false, message: 'Firebase SDK load हुन सकेन।' });
        }
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;
        return JSON.stringify({
          success: true,
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'Google User'),
          photoUrl: user.photoURL || ''
        });
      } catch (err) {
        console.error('Firebase Google Sign-In Error:', err);
        let msg = err.message || 'Google Sign-In मा त्रुटि भयो';
        if (err.code === 'auth/popup-closed-by-user') {
          msg = 'Google लगइन पपअप विन्डो बन्द गरियो।';
        } else if (err.code === 'auth/popup-blocked') {
          msg = 'ब्राउजरले पपअप ब्लक गर्‍यो। कृपया पपअप (Popup) खुला गर्नुहोस्।';
        } else if (err.code === 'auth/cancelled-popup-request') {
          msg = 'लगइन अनुरोध रद्द भयो।';
        } else if (err.code === 'auth/network-request-failed') {
          msg = 'इन्टरनेट कनेक्सन समस्या भयो।';
        }
        return JSON.stringify({
          success: false,
          code: err.code,
          message: msg
        });
      }
    };
  </script>
