name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi
      - name: Stage APKs in Web directory
        run: |
          mkdir -p ./web/apk
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./web/apk/eps_topik_ubt_2026.apk
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./web/apk/app-arm64-v8a-release.apk
          cp ./build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ./web/apk/app-armeabi-v7a-release.apk
      - name: Build Web Application
        run: flutter build web --release --base-href "/epstopikabante2072/"
      - name: Finalize Web Deployment Bundle
        run: |
          mkdir -p ./build/web/apk
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./build/web/apk/eps_topik_ubt_2026.apk
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./build/web/apk/app-arm64-v8a-release.apk
          cp ./build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ./build/web/apk/app-armeabi-v7a-release.apk
          touch ./build/web/.nojekyll
          cp ./web/_config.yml ./build/web/_config.yml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
