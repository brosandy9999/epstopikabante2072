name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web Application
        run: flutter build web --release --base-href "/epstopikabante2072/"
      - name: Stage APKs and static assets in Web Bundle
        run: |
          mkdir -p ./build/web/apk
          mkdir -p ./build/web/audio
          mkdir -p ./build/web/pdf
          mkdir -p ./build/web/assets/audio
          cp -r ./web/apk/* ./build/web/apk/ 2>/dev/null || true
          cp ./apk/eps_topik_ubt_2026.apk ./build/web/apk/ 2>/dev/null || true
          cp ./apk/eps_topik_latest.apk ./build/web/apk/ 2>/dev/null || true
          cp ./apk/eps_topik_armv7.apk ./build/web/apk/ 2>/dev/null || true
          cp -r ./web/assets/* ./build/web/assets/ 2>/dev/null || true
          cp -r ./assets/audio/* ./build/web/audio/ 2>/dev/null || true
          cp -r ./web/audio/* ./build/web/audio/ 2>/dev/null || true
          cp -r ./web/pdf/* ./build/web/pdf/ 2>/dev/null || true
          cp -r ./assets/audio/* ./build/web/assets/audio/ 2>/dev/null || true
          touch ./build/web/.nojekyll
          cp ./web/_config.yml ./build/web/_config.yml 2>/dev/null || true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
